name = "imggul-background-worker"
main = "src/planner-background.js"
compatibility_date = "2024-09-23"

[vars]
PLANNER_D1_METRICS = "0"

[limits]
cpu_ms = 300_000

[observability]
enabled = true
head_sampling_rate = 1

[[d1_databases]]
binding = "DB"
database_name = "imggul_db"
database_id = "cbc3c7dd-9028-4190-94a1-eee82216cd8b"

[[r2_buckets]]
binding = "imgBucket"
bucket_name = "imggul-storage"

[triggers]
crons = ["*/2 * * * *", "17 */6 * * *"]

[[queues.consumers]]
queue = "imggul-queue"
max_batch_size = 1
max_batch_timeout = 30
max_retries = 5
max_concurrency = 1
dead_letter_queue = "imggul-generation-dlq"

[[queues.producers]]
binding = "GENERATION_QUEUE"
queue = "imggul-queue"
